<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beneficios municipales{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='portal.css') }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Ir al contenido principal</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">
        <span class="municipal-mark" aria-hidden="true"></span>
        <span>Beneficios municipales<span class="brand-caption">Portal para personas jubiladas</span></span>
      </a>
      {% if user %}
        <div class="session">
          <span class="session-name">Sesión de {{ user.preferred_username }}</span>
          <a class="button button-header" href="/logout">Cerrar sesión</a>
        </div>
      {% endif %}
    </div>
  </header>
  <main id="contenido" class="shell page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Beneficios municipales</span>
    </div>
  </footer>
</body>
</html>
